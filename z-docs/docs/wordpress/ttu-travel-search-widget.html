        p.set('infants', String(infants));

        p.set('supplier_timeout', String(Number.isFinite(timeoutMs) ? timeoutMs : SUPPLIER_TIMEOUT_MS));
        if (maxConnEl && maxConnEl.value !== 'any') p.set('max_connections', maxConnEl.value);
        if (airlinesEl && airlinesEl.value.trim()) {
          airlinesEl.value.split(',').map(s => s.trim().toUpperCase()).filter(Boolean).forEach(code => {
            p.append('carrier_iata', code);
          });
        }
        p.set('source_domain', sourceDomain());

        if (tripRaw === 'multi-city') {
          const slices = [];
          if (fromAirport && toAirport && departDate) {
            slices.push({ origin: fromAirport.code, destination: toAirport.code, departure_date: departDate });
          }
          multiCityLegs.forEach(l => {
            if (l.from && l.to && l.date) {
              slices.push({ origin: l.from.code, destination: l.to.code, departure_date: l.date });
            }
          });
          if (slices.length < 1) return null;
          p.set('slices', JSON.stringify(slices));
        } else {
          if (!fromAirport || !toAirport || !departDate) return null;
          p.set('origin', fromAirport.code);
          p.set('destination', toAirport.code);
          p.set('departure_date', departDate);
          if (tripRaw === 'round-trip' && returnDate) {
            p.set('return_date', returnDate);
            p.set('trip', 'round_trip');
          } else {
            p.set('trip', 'one_way');
          }
        }
        return MAIN_SITE + '/flights?' + p.toString();
      }

      function buildHotelsSearchUrl() {
        if (!hotelsDest || !checkIn || !checkOut) return null;
        if (checkOut <= checkIn) return null;
        const p = new URLSearchParams();
        p.set('stays_results', '1');
        p.set('check_in', checkIn);
        p.set('check_out', checkOut);
        p.set('rooms', String(rooms));
        p.set('adults', String(hotelsAdults));
        p.set('children', String(hotelsChildren));
        p.set('nationality', byId('hotels-nationality').value || 'US');
        p.set('source_domain', sourceDomain());
        if (hotelsDest.kind === 'place') {
          p.set('dest_kind', 'place');
          p.set('place_id', hotelsDest.id);
          p.set('dest_name', hotelsDest.name);
          p.set('dest_iata', hotelsDest.iata_code);
          if (hotelsDest.city_name) p.set('dest_city', hotelsDest.city_name);
          p.set('lat', String(hotelsDest.latitude));
          p.set('lng', String(hotelsDest.longitude));
          p.set('radius', String(hotelsDest.radius || 20));
        } else {
          p.set('dest_kind', 'popular');
          p.set('dest_code', hotelsDest.code);
          p.set('dest_name', hotelsDest.name);
          p.set('dest_country', hotelsDest.country);
        }
        return MAIN_SITE + '/hotels?' + p.toString();
      }

      function buildCarsSearchUrl() {
        const p = new URLSearchParams();
        if (carsLocation) p.set('pickup', carsLocation.code);
        if (carsDate) p.set('date', carsDate);
        p.set('adults', String(carsAdults));
        p.set('children', String(carsChildren));
        p.set('source_domain', sourceDomain());
        const qs = p.toString();
        return MAIN_SITE + '/cars' + (qs ? '?' + qs : '');
      }

      // State
      let fromAirport = null, toAirport = null;
      let departDate = '', returnDate = '';
      let adults = 1, children = 0, infants = 0;
      let carsLocation = null, carsDate = '';
      let carsAdults = 1, carsChildren = 0;
      let hotelsDest = null, checkIn = '', checkOut = '';
      let rooms = 1, hotelsAdults = 2, hotelsChildren = 0;
      let multiCityLegs = [];

      const MOBILE_MAX = 767;
      const MOBILE_LAYOUT_PX = 768;

      function isMobileView() {
        const root = host;
        if (root) {
          const w = root.getBoundingClientRect().width;
          if (w > 0 && w < MOBILE_LAYOUT_PX) return true;
        }
        return window.matchMedia('(max-width: ' + MOBILE_MAX + 'px)').matches;
      }

      function syncLayoutMode() {
        const root = byId('ttu-widget-root');
        if (!root) return;
        const mobile = isMobileView();
        root.classList.toggle('ttu-layout-mobile', mobile);
        root.classList.toggle('ttu-layout-desktop', !mobile);
      }

      /* ── Mobile fullscreen sheet (matches Next.js MobileFullscreenSearchOverlay) ── */
      function ensureMobileSheet() {
        if (mobileSheetEl) return;
        mobileSheetEl = document.createElement('div');
        mobileSheetEl.className = 'ttu-mobile-sheet';
        mobileSheetEl.setAttribute('role', 'dialog');
        mobileSheetEl.setAttribute('aria-modal', 'true');
        mobileSheetEl.innerHTML =
          '<header class="ttu-mobile-sheet-header">' +
          '<button type="button" class="ttu-mobile-sheet-close" aria-label="Close">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
          '</button>' +
          '<h2 class="ttu-mobile-sheet-title"></h2>' +
          '</header>' +
          '<div class="ttu-mobile-sheet-header-slot"></div>' +
          '<div class="ttu-mobile-sheet-body ttu-dropdown-scroll"></div>';
        document.body.appendChild(mobileSheetEl);
        mobileSheetTitleEl = mobileSheetEl.querySelector('.ttu-mobile-sheet-title');
        mobileSheetBodyEl = mobileSheetEl.querySelector('.ttu-mobile-sheet-body');
        mobileSheetHeaderSlotEl = mobileSheetEl.querySelector('.ttu-mobile-sheet-header-slot');
        mobileSheetEl.querySelector('.ttu-mobile-sheet-close').addEventListener('click', closeMobileSheet);
      }

      function openMobileSheet(title, renderBody, headerHtml) {
        ensureMobileSheet();
        mobileSheetTitleEl.textContent = title;
        mobileSheetHeaderSlotEl.innerHTML = headerHtml || '';
        mobileSheetBodyEl.innerHTML = '';
        renderBody(mobileSheetBodyEl);
        mobileSheetEl.classList.add('open');
        mobileSheetPrevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        document.documentElement.classList.add('ttu-sheet-open');
        const focusable = mobileSheetBodyEl.querySelector('input, button, select, textarea');
        if (focusable) setTimeout(() => focusable.focus(), 50);
      }

      function closeMobileSheet() {
        if (!mobileSheetEl) return;
        mobileSheetEl.classList.remove('open');
        document.body.style.overflow = mobileSheetPrevOverflow;
        document.documentElement.classList.remove('ttu-sheet-open');
        mobileSheetBodyEl.innerHTML = '';
        mobileSheetHeaderSlotEl.innerHTML = '';
      }

      function openAirportMobileSheet(title, onSelect) {
        openMobileSheet(title, (body) => {
          const searchWrap = document.createElement('div');
          searchWrap.className = 'ttu-mobile-search-input';
          searchWrap.innerHTML = '<input type="search" placeholder="Search city or airport..." autocomplete="off" enterkeyhint="search">';
          body.appendChild(searchWrap);
          const list = document.createElement('div');
          list.className = 'ttu-mobile-list';
          body.appendChild(list);
          const input = searchWrap.querySelector('input');
          async function renderList(q) {
            const items = q.trim().length >= 2 ? await fetchAirportsSuggest(q) : filterAirports(AIRPORTS, q);
            renderDropdown(list, items, airportItemHtml, a => {
              onSelect(a);
              closeMobileSheet();
              updateSearchButtons();
            });
          }
          renderList('');
          input.addEventListener('input', () => { renderList(input.value); });
        });
      }

      function openHotelDestMobileSheet() {
        openMobileSheet('Destination', (body) => {
          const searchWrap = document.createElement('div');
          searchWrap.className = 'ttu-mobile-search-input';
          searchWrap.innerHTML = '<input type="search" placeholder="Search destination..." autocomplete="off" enterkeyhint="search">';
          body.appendChild(searchWrap);
          const list = document.createElement('div');
          list.className = 'ttu-mobile-list';
          body.appendChild(list);
          const input = searchWrap.querySelector('input');
          async function renderList(q) {
            let items;
            if (!q || q.trim().length < 2) {
              items = DESTINATIONS.map(d => ({ kind: 'popular', ...d }));
            } else {
              items = await fetchHotelPlacesSuggest(q);
              if (!items.length) items = filterDestinations(DESTINATIONS, q).map(d => ({ kind: 'popular', ...d }));
            }
            renderDropdown(list, items, d => {
              const label = d.kind === 'place'
                ? (d.city_name || d.name) + (d.iata_code ? ' (' + d.iata_code + ')' : '')
                : d.name + ', ' + d.country;
              return `<div class="ttu-item-title">${label}</div><div class="ttu-item-sub">${d.kind === 'place' ? d.name : d.type || 'City'}</div>`;
            }, d => {
              hotelsDest = d.kind === 'place' ? d : { kind: 'popular', code: d.code, name: d.name, country: d.country };
              byId('hotels-dest-display').textContent = d.name + (d.country ? ', ' + d.country : '');
              byId('hotels-dest-display').className = 'ttu-value';
              closeMobileSheet();
              updateSearchButtons();
            });
          }
          renderList('');
          input.addEventListener('input', () => { renderList(input.value); });
        });
      }

      function openDateMobileSheet(title, selected, minDateYmd, onSelect) {
        openMobileSheet(title, (body) => {
          const card = document.createElement('div');
          card.className = 'ttu-mobile-calendar-card';
          const calHost = document.createElement('div');
          const calId = 'ttu-mobile-cal-' + Date.now();
          calHost.id = calId;
          calHost.className = 'ttu-calendar';
          card.appendChild(calHost);
          body.appendChild(card);
          buildCalendar(calId, selected, d => {
            onSelect(d);
            closeMobileSheet();
            updateSearchButtons();
          }, undefined, undefined, minDateYmd);
        });
      }

      function openTravelersMobileSheet(title, sourceDropdownId) {
        const src = byId(sourceDropdownId);
        if (!src) return;
        openMobileSheet(title, (body) => {
          const panel = document.createElement('div');
          panel.className = 'ttu-traveler-panel';
          panel.innerHTML = src.innerHTML;
          body.appendChild(panel);
          wireTravelerPanel(panel, sourceDropdownId);
        });
      }

      function wireTravelerPanel(panel, sourceDropdownId) {
        panel.querySelectorAll('button[id]').forEach(btn => {
          const orig = byId(btn.id);
          if (!orig) return;
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            orig.click();
            panel.innerHTML = byId(sourceDropdownId).innerHTML;
            wireTravelerPanel(panel, sourceDropdownId);
          });
        });
      }

      function openAdvancedMobileSheet() {
        openMobileSheet('Advanced options', (body) => {
          const panel = byId('advanced-panel');
          const clone = panel.cloneNode(true);
          clone.id = 'advanced-panel-mobile';
          clone.className = 'ttu-advanced-panel-mobile';
          clone.style.display = 'grid';
          body.appendChild(clone);
        });
      }

      function openCarsLocationMobileSheet() {
        openMobileSheet('From Airport', (body) => {
          const list = document.createElement('div');
          list.className = 'ttu-mobile-list';
          body.appendChild(list);
          renderDropdown(list, CAR_LOCATIONS, a =>
            `<div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div><div class="ttu-item-title">${a.city}</div><div class="ttu-item-sub">${a.name}</div></div>
              <span class="ttu-item-code">${a.code}</span>
            </div><div class="ttu-item-sub">${a.country}</div>`, a => {
            carsLocation = a;
            byId('cars-from-display').textContent = a.city + ' (' + a.code + ')';
            byId('cars-from-display').className = 'ttu-value';
            closeMobileSheet();
            updateSearchButtons();
          });
        });
      }

      function airportItemHtml(a) {
        return `<div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div><div class="ttu-item-title">${a.city}</div><div class="ttu-item-sub">${a.name}</div></div>
          <span class="ttu-item-code">${a.code}</span>
        </div>
        <div class="ttu-item-sub">${a.country}</div>`;
      }

      function bindAirportField(prefix, onSelect, mobileTitle) {
        const trigger = byId(prefix + '-trigger');
        const searchWrap = byId(prefix + '-search-wrap');
        const searchInput = byId(prefix + '-search-input');
        const dropdown = byId(prefix + '-dropdown');
        const display = byId(prefix + '-display');
        if (!trigger || !searchWrap || !searchInput || !dropdown || !display) return;

        function close() {
          trigger.style.display = '';
          searchWrap.style.display = 'none';
          dropdown.style.display = 'none';
        }

        function open() {
          if (isMobileView()) {
            openAirportMobileSheet(mobileTitle || 'Select airport', a => {
              onSelect(a);
              display.textContent = a.city + ' (' + a.code + ')';
              display.className = 'ttu-value';
            });
            return;
          }
          $qa('.ttu-dropdown').forEach(d => { d.style.display = 'none'; });
          $qa('.ttu-input-search').forEach(w => { w.style.display = 'none'; });
          $qa('.ttu-input-display').forEach(t => { t.style.display = ''; });
          trigger.style.display = 'none';
          searchWrap.style.display = 'flex';
          searchInput.value = '';
          dropdown.style.display = 'block';
          renderDropdown(dropdown, AIRPORTS, airportItemHtml, a => {
            onSelect(a);
            display.textContent = a.city + ' (' + a.code + ')';
            display.className = 'ttu-value';
            close();
            updateSearchButtons();
          });
          setTimeout(() => searchInput.focus(), 50);
        }

        trigger.addEventListener('click', (e) => { e.stopPropagation(); open(); });
        searchInput.addEventListener('input', async () => {
          if (isMobileView()) return;
          const q = searchInput.value;
          const items = q.trim().length >= 2 ? await fetchAirportsSuggest(q) : filterAirports(AIRPORTS, q);
          renderDropdown(dropdown, items, airportItemHtml, a => {
            onSelect(a);
            display.textContent = a.city + ' (' + a.code + ')';
            display.className = 'ttu-value';
            close();
            updateSearchButtons();
          });
        });
      }

      function toLocalYmd(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      function parseYmd(s) {
        const [y, m, d] = s.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        dt.setHours(0, 0, 0, 0);
        return dt;
      }

      function startOfToday() {
        const t = new Date();
        t.setHours(0, 0, 0, 0);
        return t;
      }

      function addDaysYmd(ymd, days) {
        const d = parseYmd(ymd);
        d.setDate(d.getDate() + days);
        return toLocalYmd(d);
      }

      function minReturnDateYmd() {
        if (!departDate) return toLocalYmd(startOfToday());
        const dep = parseYmd(departDate);
        const today = startOfToday();
        return toLocalYmd(dep >= today ? dep : today);
      }

      function minCheckOutYmd() {
        if (!checkIn) return toLocalYmd(startOfToday());
        return addDaysYmd(checkIn, 1);
      }

      function resetDateDisplay(displayId, placeholder) {
        const el = byId(displayId);
        if (!el) return;
        el.textContent = placeholder || 'Select Date';
        el.className = 'ttu-placeholder';
      }

      function canSearchFlights() {
        const trip = $q('input[name="trip-type"]:checked').value;
        if (trip === 'multi-city') {
          if (!fromAirport || !toAirport || !departDate) return false;
          for (let i = 0; i < multiCityLegs.length; i++) {
            const l = multiCityLegs[i];
            const partial = !!(l.from || l.to || l.date);
            if (partial && !(l.from && l.to && l.date)) return false;
          }
          return true;
        }
        if (!fromAirport || !toAirport || !departDate) return false;
        if (trip === 'round-trip') {
          if (!returnDate) return false;
          if (returnDate < departDate) return false;
        }
        return true;
      }

      function canSearchHotels() {
        if (!hotelsDest || !checkIn || !checkOut) return false;
        return checkOut > checkIn;
      }

      function canSearchCars() {
        return !!(carsLocation && carsDate);
      }

      function updateSearchButtons() {
        const fb = byId('search-flights');
        const hb = byId('search-hotels');
        const cb = byId('search-cars');
        const swapBtn = byId('swap-btn');
        if (fb) fb.disabled = !canSearchFlights();
        if (hb) hb.disabled = !canSearchHotels();
        if (cb) cb.disabled = !canSearchCars();
        if (swapBtn) swapBtn.disabled = !(fromAirport && toAirport);
      }

      function formatDate(s) {
        if (!s) return 'Select Date';
        const d = parseYmd(s);
        return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      }

      function buildCalendar(id, selected, onSelect, year, month, minDateYmd) {
        const cal = byId(id);
        if (!cal) return;
        const now = new Date();
        const y = year ?? now.getFullYear();
        const m = month ?? now.getMonth();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const firstDay = new Date(y, m, 1).getDay();
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const minDate = minDateYmd ? parseYmd(minDateYmd) : startOfToday();
        const todayYmd = toLocalYmd(startOfToday());

        const navSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>';
        const navSvgNext = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
        let html = '<div class="ttu-calendar-header">';
        html += '<button type="button" class="ttu-calendar-nav" data-prev aria-label="Previous month">' + navSvg + '</button>';
        html += '<h3>' + monthNames[m] + ' ' + y + '</h3>';
        html += '<button type="button" class="ttu-calendar-nav" data-next aria-label="Next month">' + navSvgNext + '</button></div>';
        html += '<div class="ttu-calendar-days">';
        ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].forEach(d => { html += '<div class="ttu-calendar-day-label">' + d + '</div>'; });
        for (let i = 0; i < firstDay; i++) html += '<div></div>';
        for (let day = 1; day <= daysInMonth; day++) {
          const cell = new Date(y, m, day);
          cell.setHours(0, 0, 0, 0);
          const dateStr = toLocalYmd(cell);
          const isToday = dateStr === todayYmd;
          const isSel = selected === dateStr;
          const isDisabled = cell < minDate;
          let cls = 'ttu-calendar-day';
          if (isToday) cls += ' today';
          if (isSel) cls += ' selected';
          if (isDisabled) cls += ' disabled';
          html += '<button type="button" class="' + cls + '" data-date="' + dateStr + '"' + (isDisabled ? ' disabled' : '') + '>' + day + '</button>';
        }
        html += '</div>';
        cal.innerHTML = html;

        cal.querySelectorAll('[data-date]:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => { onSelect(btn.dataset.date); });
        });
        cal.querySelector('[data-prev]').addEventListener('click', () => {
          const nm = m === 0 ? 11 : m - 1, ny = m === 0 ? y - 1 : y;
          buildCalendar(id, selected, onSelect, ny, nm, minDateYmd);
        });
        cal.querySelector('[data-next]').addEventListener('click', () => {
          const nm = m === 11 ? 0 : m + 1, ny = m === 11 ? y + 1 : y;
          buildCalendar(id, selected, onSelect, ny, nm, minDateYmd);
        });
      }

      function renderDropdown(container, items, renderItem, onSelect) {
        container.innerHTML = '';
        if (items.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'ttu-dropdown-item';
          empty.style.cssText = 'color:var(--ttu-muted-fg);cursor:default';
          empty.textContent = 'No results found';
          container.appendChild(empty);
          return;
        }
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'ttu-dropdown-item';
          div.innerHTML = renderItem(item);
          div.addEventListener('click', (e) => { e.stopPropagation(); onSelect(item); });
          container.appendChild(div);
        });
      }

      // Tabs
      $qa('.ttu-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const t = tab.dataset.tab;
          $qa('.ttu-tab').forEach(x => { x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); });
          tab.classList.add('active'); tab.setAttribute('aria-pressed', 'true');
          $qa('.ttu-panel').forEach(p => p.classList.remove('active'));
          byId('panel-' + t).classList.add('active');
        });
      });

      function filterDestinations(list, q) {
        if (!q || !q.trim()) return list;
        const ql = q.toLowerCase().trim();
        return list.filter(d =>
          d.name.toLowerCase().includes(ql) ||
          d.code.toLowerCase().includes(ql) ||
          d.country.toLowerCase().includes(ql)
        );
      }

      function renderMultiCityLegs() {
        const wrap = byId('multi-city-legs');
        wrap.innerHTML = '';
        multiCityLegs.forEach((leg, idx) => {
          const legId = 'mc' + idx;
          const row = document.createElement('div');
          row.className = 'ttu-mc-leg-row';
          row.innerHTML = `
            <div class="ttu-location-group">
              <div class="ttu-field ttu-city-field">
                <label>Flying From</label>
                <div class="ttu-input-wrap ttu-input-display" id="${legId}-from-trigger">
                  <span class="ttu-placeholder" id="${legId}-from-display">${leg.from ? leg.from.city + ' (' + leg.from.code + ')' : 'Select City'}</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ttu-primary)"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="ttu-input-wrap ttu-input-search" id="${legId}-from-search-wrap" style="display:none">
                  <input type="text" id="${legId}-from-search-input" placeholder="Search origin..." autocomplete="off">
                </div>
                <div class="ttu-dropdown ttu-dropdown-scroll" id="${legId}-from-dropdown" style="display:none"></div>
              </div>
              <button type="button" class="ttu-swap-btn ttu-mc-swap" data-leg="${idx}" title="Swap">
                <svg class="ttu-swap-icon-mobile" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
              </button>
              <div class="ttu-field ttu-city-field">
                <label>Destination To</label>
                <div class="ttu-input-wrap ttu-input-display" id="${legId}-to-trigger">
                  <span class="${leg.to ? 'ttu-value' : 'ttu-placeholder'}" id="${legId}-to-display">${leg.to ? leg.to.city + ' (' + leg.to.code + ')' : 'Select City'}</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ttu-primary)"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="ttu-input-wrap ttu-input-search" id="${legId}-to-search-wrap" style="display:none">
                  <input type="text" id="${legId}-to-search-input" placeholder="Search destination..." autocomplete="off">
                </div>
                <div class="ttu-dropdown ttu-dropdown-scroll" id="${legId}-to-dropdown" style="display:none"></div>
              </div>
            </div>
            <div class="ttu-field ttu-mc-date">
              <label>Depart Date</label>
              <div class="ttu-input-wrap" id="${legId}-date-trigger">

          a.code.toLowerCase().includes(ql) ||
          a.name.toLowerCase().includes(ql) ||
          a.country.toLowerCase().includes(ql)

        }
        if (!pathMatches(e, '#hotels-dest-trigger') && !pathMatches(e, '#hotels-dest-search-wrap') && !pathMatches(e, '#hotels-dest-dropdown')) {
          closeHotelsDestDropdown();
        }
        if (!pathMatches(e, '.ttu-field')) {
          byId('cars-from-dropdown').style.display = 'none';
        }
        if (!pathMatches(e, '.ttu-field') && !pathMatches(e, '.ttu-traveler-dropdown') && !pathMatches(e, '.ttu-calendar')) {
          $qa('.ttu-traveler-dropdown').forEach(el => { el.style.display = 'none'; });
          closeAllCalendars();
        }
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          if (mobileSheetEl && mobileSheetEl.classList.contains('open')) {
            closeMobileSheet();
            return;
          }
          closeFromDropdown();
          closeToDropdown();
          closeHotelsDestDropdown();
          byId('cars-from-dropdown').style.display = 'none';
          $qa('.ttu-traveler-dropdown').forEach(el => { el.style.display = 'none'; });
          closeAllCalendars();
        }
      });

      updateSearchButtons();
      syncLayoutMode();

      const ttuRoot = byId('ttu-widget-root') || host;
      if (ttuRoot && typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(syncLayoutMode).observe(host);
      }
      window.addEventListener('resize', syncLayoutMode);
      window.addEventListener('orientationchange', syncLayoutMode);

      window.matchMedia('(max-width: ' + MOBILE_MAX + 'px)').addEventListener('change', () => {
        syncLayoutMode();
        if (!isMobileView()) closeMobileSheet();
      });
    })();
  </script>
